<script>
(function () {
  var CYCLE = 60;          // full loop length, seconds
  var HOLD_COMPLETE = 5;   // pause on the finished building (photo visible)
  var HOLD_PLAN = 2.5;     // pause on the 2D plan
  function start() {
    var b = document.querySelector('syncro-building');
    var photo = document.getElementById('photo');
    if (!b || !photo) return;
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { b.setAttribute('progress', '0'); photo.style.opacity = '1'; return; }
    var t0 = performance.now();
    var ease = function (u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
    var visible = true;
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) {
        visible = es[0].isIntersecting;
        if (visible) requestAnimationFrame(loop);
      }, { threshold: 0.05 }).observe(document.getElementById('hero'));
    }
    function loop() {
      var anim = (CYCLE - HOLD_COMPLETE - HOLD_PLAN) / 2;
      var t = ((performance.now() - t0) / 1000) % CYCLE;
      var p;
      if (t < HOLD_COMPLETE) p = 0;
      else if (t < HOLD_COMPLETE + anim) p = ease((t - HOLD_COMPLETE) / anim);
      else if (t < HOLD_COMPLETE + anim + HOLD_PLAN) p = 1;
      else p = 1 - ease((t - HOLD_COMPLETE - anim - HOLD_PLAN) / anim);
      b.setAttribute('progress', p.toFixed(4));
      var o = Math.max(0, Math.min(1, 1 - p / 0.1));
      photo.style.opacity = o.toFixed(3);
      photo.style.transform = 'scale(' + (1 + 0.04 * (1 - o)).toFixed(4) + ')';
      if (visible) requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
